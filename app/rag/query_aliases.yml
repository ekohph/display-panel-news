# Query-expansion aliases for BM25 retrieval.
# When a user query includes any alias, expand it with the other aliases in
# the same group. Keep terms specific to display-panel news and add variants
# only when they are genuinely interchangeable for retrieval.

groups:
  - id: inkjet_oled
    aliases:
      - 잉크젯
      - inkjet
      - ink-jet
      - IJP

  - id: micro_oled
    aliases:
      - 마이크로 OLED
      - micro OLED
      - micro-OLED
      - OLEDoS
