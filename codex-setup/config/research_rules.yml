research_rules:
  recurring_tracking_topics:
    display_sensors:
      scope: "Sensors integrated into or used with display panels: optical/fingerprint, proximity, ambient-light and NIR sensing with an established display application. General NIR sensors alone are outside scope."
      touch_separate_search: "Search touch independently within sensors: in-cell/on-cell, capacitive/optical touch, stylus/pen input and integration across product segments."
    stretchable_display:
      scope: "Emitters, TFTs, electrodes/interconnects, substrates, encapsulation, strain/image compensation, manufacturing and reliability."
    neuromorphic_tft:
      scope: "Synaptic transistors, oxide/organic TFTs, optoelectronic synapses, plasticity, learning and device/array integration; direct display application is not required."
    glass_packaging:
      scope: "Glass substrates/core substrates/interposers, TGV, redistribution layers, panel-level packaging, equipment, processes and reliability; direct display application is not required."
    search_rule: "Check all four topics and touch separately on every industrial-news pass, even without company-news candidates. Run broad paper searches on Sunday/monthly research dates using reference/search_queries.md."
    eligibility: "Topic definitions take precedence over general display-anchor and non-display-application filters, including oxide/IGZO filters. Verify the actual topic match in public sources."
    output_rule: "Include substantive verified non-duplicate findings only, omit empty sections, avoid quotas, state actual applications accurately and keep editorial-policy history out of public briefings."

  cadence:
    ordinary_daily: "Do not run broad paper search unless a research item is directly tied to a major public industry announcement."
    sunday: "Run weekly research search and include a section only when meaningful display-related or recurring-topic items are found."
    monthly: "Include longer-horizon paper and research trend synthesis."

  sunday_ai_paper_review:
    required: true
    arxiv_categories:
      - "cs.AI"
      - "cs.CV"
      - "cs.LG"
      - "cs.CL"
      - "cs.RO"
    scope: "Review the prior week's AI papers and select one Top 1 item across display-related AI, manufacturing or inspection technology, and materials-related AI."
    priority_order:
      - "Direct display-device, panel, display manufacturing, or inspection relevance"
      - "Clear manufacturing or materials impact that can transfer to display production"
      - "General AI relevance with a defensible display connection"
    weak_display_rule: "If display relevance is weak, place the item in a separate AI-related section and state the specific connection to displays and its limitation."

  include_when:
    - "A recurring_tracking_topics match establishes scope eligibility, including neuromorphic TFT and glass packaging without direct display application; public evidence and novelty rules still apply."
    - "Scope eligibility requires a recurring_tracking_topics match OR an explicit source connection to display devices, panel architecture, display backplanes, pixels, OLED, LCD, AMOLED, microdisplay, active matrix, display manufacturing, or display materials."
    - "The public abstract, official journal page, DOI metadata, university release, or reputable secondary source supports the display relevance or recurring tracking topic match."
    - "For new-paper sections, the item is meaningfully new and not already covered by DOI, arXiv ID, official URL, or normalized title. The separate Sunday trend-linked review may revisit covered or older papers."

  publisher_ai_discovery:
    required_on_sunday: true
    sources: ["publisher pages", "Crossref", "OpenAlex"]
    rule: "Use all three as discovery routes alongside arXiv, not only metadata fallbacks. Search AI/display combinations in reference/search_queries.md and adapt them to the week's trends."
    dates: "Verify first online publication separately from issue and discovery dates. Older papers belong in the trend-linked review, not the prior-week new-paper section."

  trend_linked_paper_review:
    heading: "이번 주 트렌드와 연결한 주요 논문 리뷰"
    cadence: "Sunday"
    count: "One or two important papers when a substantive weekly trend connection exists; otherwise omit."
    publication_window: "Unrestricted; show the original publication date."
    allow_previously_covered: true
    selection: "Compare new discoveries and known papers by direct connection to the week's trends, significance and evidence. Explain when a newly found paper is more relevant than known candidates."
    output_fields: ["논문명 / DOI / 최초 공개일", "첫 소개 또는 재검토", "이번 주 트렌드와의 연결", "핵심 기여", "근거와 한계", "지금 선정한 이유", "원문"]
    rule: "Explain why a revisit matters now and link earlier briefing coverage when available. Keep this section separate from prior-week AI Top 1; avoid repeating a paper at length within one edition."

  known_paper_memory:
    local_path: "operations-local/known_papers.json (relative to the workflow root)"
    statuses: ["candidate", "covered"]
    rule: "Save relevant discoveries by normalized DOI/arXiv ID. Mark user-discussed or briefing-reported papers covered, distinguishing coverage_basis from briefing_history. Consult legacy seen_articles.json too."
    exclusions: "Honor per-paper edition exclusions and no-reminder preferences. Covered papers remain eligible for justified trend-linked revisits, not first-time coverage."
    privacy: "Keep private correspondence and contact details out of the register and public outputs."

  ai_top1_selection:
    required_on_sunday: true
    eligible_topics:
      - "AI for display design, rendering, calibration, or display quality"
      - "AI for display manufacturing, process control, yield, defect detection, or inspection"
      - "AI for display materials discovery, formulation, or reliability prediction"
    output_fields:
      - "Top 1 선정 이유"
      - "디스플레이 연결 관점"
      - "한계 또는 상용화 거리"
    rule: "Choose exactly one paper from the prior week; do not rank by citation count alone, and do not present a weakly related general AI paper as a display paper."

  exclude_when:
    - "Apply general scope exclusions below only outside recurring_tracking_topics; topic-matched work still requires substantive public evidence."
    - "The work is only generally about semiconductors, optics, materials, sensors, memory, AI, or power electronics without explicit display relevance."
    - "The only visible information is paywalled and public metadata is too thin to support a defensible summary."
    - "The paper is a minor incremental variant and has no clear implication for its tracked topic, display technology, panel architecture, or manufacturing."

  oxide_tft_and_igzo_rule:
    applicability: "Display-backplane searches outside recurring_tracking_topics. Search neuromorphic TFT independently; display sensors follow their topic definition."
    reason: "IGZO and oxide semiconductors are used in both display backplanes and non-display semiconductor devices. Standalone IGZO is too broad."
    never_use_as_standalone_inclusion_terms:
      - "IGZO"
      - "a-IGZO"
      - "oxide semiconductor"
    require_device_term:
      - "IGZO TFT"
      - "a-IGZO TFT"
      - "In-Ga-O TFT"
      - "IGO TFT"
      - "polycrystalline In-Ga-O thin-film transistor"
      - "polycrystalline oxide TFT"
      - "amorphous indium gallium zinc oxide thin-film transistor"
      - "oxide semiconductor TFT"
      - "thin-film transistor"
      - "TFT"
      - "oxygen vacancy"
      - "oxygen diffusion"
      - "metal capping"
      - "contact metal"
      - "gate dielectric"
      - "channel scaling"
      - "ultrathin IGZO"
    require_display_anchor:
      - "display"
      - "panel"
      - "backplane"
      - "pixel"
      - "OLED"
      - "LCD"
      - "AMOLED"
      - "microdisplay"
      - "active matrix"
      - "display manufacturing"
    exclude_if_only_application_is:
      - "DRAM"
      - "3D NAND"
      - "embedded memory"
      - "BEOL logic"
      - "power electronics"
      - "sensor"
      - "general semiconductor integration"

  metadata_fallback:
    use_when:
      - "Publisher ASAP pages are not indexed yet."
      - "Publisher pages block automated access."
      - "Search results show a title but not a stable article page."
    allowed_sources:
      - "Crossref"
      - "OpenAlex"
      - "PubMed"
      - "arXiv"
      - "official DOI landing page"
      - "official university or research-lab release"
    summary_limit: "Use only publicly visible metadata and abstracts. Do not infer unsupported claims from a title alone."

  deduplication:
    primary_keys:
      - "DOI"
      - "arXiv ID"
      - "PubMed ID"
      - "official journal URL"
      - "official university or lab release URL"
    secondary_keys:
      - "normalized title"
      - "first author plus publication date"
